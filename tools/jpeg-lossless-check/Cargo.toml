[package]
name = "jpeg-lossless-check"
version = "0.1.0"
edition = "2024"
publish = false
description = "Check lossless JPEG transforms (progressive→sequential, EXIF-orientation rotation) at the coefficient and pixel level, and their JPEG-in-JXL transcodes"

# Standalone: not part of any workspace.
[workspace]

[dependencies]
# Current-main codec sources for the finalization recheck; Cargo.lock records the revisions.
zenjpeg = { git = "https://github.com/imazen/zenjpeg", branch = "main" }
jxl-encoder = { git = "https://github.com/imazen/jxl-encoder", branch = "main", default-features = false, features = ["std", "jpeg-reencoding"] }
zenjxl-decoder = { git = "https://github.com/imazen/zenjxl-decoder", branch = "main", features = ["jpeg"] }
enough = { git = "https://github.com/imazen/enough", branch = "main" }
sha2 = "0.11.0"

[patch.crates-io]
enough = { git = "https://github.com/imazen/enough", branch = "main" }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", branch = "main" }
zenanalyze = { git = "https://github.com/imazen/zenanalyze", branch = "main" }

[profile.release]
debug = false
