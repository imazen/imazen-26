[package]
name = "corpus-thumbs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Render oriented, sRGB thumbnail sprite sheets of corpus sources through zencodecs, zenpixels-convert and zenresize"

# Standalone: not part of any workspace. zen-main/ holds checkouts of other workspaces.
[workspace]
exclude = ["zen-main"]

[dependencies]
# Built against the main branch of every imazen crate, never crates.io releases
# (owner rule, 2026-10-15). Cargo.lock records the commits a run used.
zencodecs = { git = "https://github.com/imazen/zenpipe", branch = "main", default-features = false, features = ["jpeg", "png", "webp", "heic-decode", "raw-decode", "raw-decode-exif"] }
zencodec = { git = "https://github.com/imazen/zencodec", branch = "main" }
zenpixels = { git = "https://github.com/imazen/zenpixels", branch = "main", default-features = false, features = ["std"] }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", branch = "main", features = ["rgb", "imgref"] }
zenresize = { git = "https://github.com/imazen/zenresize", branch = "main" }
imgref = "1.12.3"
rgb = "0.8.53"

# Every imazen crate reached through zencodecs resolves to main as well, except archmage,
# magetypes (main is 0.9.31-beta.1) and zentone (main is 0.2.0): the other mains require
# their crates.io releases, and Cargo only substitutes a version inside the requested range.
[patch.crates-io]
zencodec = { path = "zen-main/zencodec" }
zenmeta = { path = "zen-main/zencodec/zenmeta" }
ultrahdr-core = { path = "zen-main/ultrahdr/ultrahdr-core" }
whereat = { git = "https://github.com/lilith/whereat", branch = "main" }
zenpixels = { git = "https://github.com/imazen/zenpixels", branch = "main" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", branch = "main" }
zenresize = { git = "https://github.com/imazen/zenresize", branch = "main" }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", branch = "main" }
heic = { git = "https://github.com/imazen/heic", branch = "main" }
zenpng = { git = "https://github.com/imazen/zenpng", branch = "main" }
zenraw = { git = "https://github.com/imazen/zenraw", branch = "main" }
zenwebp = { git = "https://github.com/imazen/zenwebp", branch = "main" }
zenflate = { git = "https://github.com/imazen/zenflate", branch = "main" }
zenanalyze = { git = "https://github.com/imazen/zenanalyze", branch = "main" }
enough = { git = "https://github.com/imazen/enough", branch = "main" }
how-far = { git = "https://github.com/imazen/how-far", branch = "main" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", branch = "main" }
garb = { git = "https://github.com/imazen/garb", branch = "main" }
winarm-cpufeatures = { git = "https://github.com/imazen/winarm-cpufeatures", branch = "main" }
zenblend = { git = "https://github.com/imazen/zenblend", branch = "main" }
zenquant = { git = "https://github.com/imazen/zenquant", branch = "main" }
zenyuv = { git = "https://github.com/imazen/zenjpeg", branch = "main" }

# Several mains pin older zencodec, zenmeta and ultrahdr-core commits. Cargo can't patch a git
# source with the same URL, so all of them resolve to the main checkouts in zen-main/
# (./sync-main.sh clones them and records the commits).
[patch."https://github.com/imazen/zencodec"]
zencodec = { path = "zen-main/zencodec" }
zenmeta = { path = "zen-main/zencodec/zenmeta" }

[patch."https://github.com/imazen/ultrahdr"]
ultrahdr-core = { path = "zen-main/ultrahdr/ultrahdr-core" }

[profile.release]
debug = false
